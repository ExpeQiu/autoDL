[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autodl-cli"
version = "0.1.0"
description = "AutoDL 算力 CLI，供智能体平台调用"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "httpx>=0.24.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
mcp = ["mcp>=1.0"]

[project.scripts]
autodl = "autodl_cli.cli:main"
autodl-mcp = "autodl_cli.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autodl_cli*"]

[tool.setuptools.package-data]
autodl_cli = ["py.typed"]
